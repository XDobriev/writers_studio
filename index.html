        }
      },
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Это нейросеть пишет за меня?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Нет. Авторская студия — это редактор и хранилище материалов книги. Никакого автодополнения, генерации абзацев и «исправь стиль» по умолчанию. Если когда-нибудь добавим — это будет отдельный режим с явным выключателем."
            }
          },
          {
            "@type": "Question",
            "name": "Что будет, если я перестану платить?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Все ваши книги остаются. Доступ к Pro-функциям отключается, но вы продолжаете писать в Free-режиме на той книге, которую укажете главной. Никто не блокирует и не удаляет файлы."
            }
          },
          {
            "@type": "Question",
            "name": "Можно ли импортировать рукопись из Word или Scrivener?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Прямого импорта пока нет. Вставьте текст напрямую в редактор или разбейте на главы вручную — это занимает несколько минут. Импорт из DOCX добавим в следующих версиях."
            }
          },
          {
            "@type": "Question",
            "name": "Хранятся ли мои книги в облаке?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Да, в защищённой облачной базе данных с шифрованием. Доступ только у вас — через email или Google. В любой момент можно скачать полный экспорт рукописи."
            }
          },
          {
            "@type": "Question",
            "name": "Я пишу не роман — поэзия / нон-фикшн / сценарий. Подойдёт?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Поэзия и эссеистика — да, без оговорок. Нон-фикшн — да, особенно если он структурный (главы, разделы). Сценарии — пока нет специальной разметки Fountain / Final Draft, на дорожной карте."
            }
          },
          {
            "@type": "Question",
            "name": "Если я нашёл баг или хочу фичу?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Напишите в issues на GitHub или на почту — ответ обычно в течение суток. Pro-подписчики попадают в Telegram-чат с разработчиком напрямую."
            }
          }
        ]
      }
