    <!-- Анти-флэш предотрисованного лендинга.
         scripts/prerender.mjs пишет полностью отрендеренный лендинг в dist/index.html (SEO
         для Яндексбота). nginx и Vercel отдают ЭТОТ index.html как SPA-fallback для ВСЕХ
         роутов, поэтому на /books и др. лендинг красится до загрузки React. Прячем #root
         ДО парса body (CSS в head), когда предотрисованное содержимое не относится к роуту;
         main.tsx очистит #root и снимет класс. Краулеры JS не исполняют — SEO не страдает. -->
    <style>html.prerender-stale #root{display:none!important}</style>
    <script>
      (function () {
        try {
          var p = location.pathname.replace(/\/+$/, '') || '/';
          var prerendered = p === '/' || p === '/privacy' || p === '/terms';
          // Update canonical to current page for non-prerendered routes
          var c = document.querySelector('link[rel="canonical"]');
          if (c && !prerendered) c.href = location.origin + p;
          var loggedIn = false;
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k && k.slice(0, 3) === 'sb-' && k.indexOf('-auth-token') > 0) {
              var v = JSON.parse(localStorage.getItem(k) || 'null');
              if (v && v.access_token) { loggedIn = true; break; }
            }
          }
          // Прячем, если роут не предотрисован (отдан лендинг-fallback) либо это корень,
          // но юзер залогинен — Landing всё равно редиректнет на /books.
          if (!prerendered || (p === '/' && loggedIn)) {
            document.documentElement.classList.add('prerender-stale');
          }
        } catch (e) {}
      })();
    </script>
