name: Billing Scheduler

# Основной запуск — pg_cron в Supabase (миграция 20261022000900_cron_billing_retention.sql).
# Этот workflow — ручной резерв. Ответ функции в лог не печатается (репозиторий публичный):
# только HTTP-статус и счётчики.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: billing
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call billing-scheduler
        run: |
          STATUS=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.SCHEDULER_SECRET }}" \
            "https://joaxeoavjvlqmtlepkrr.supabase.co/functions/v1/billing-scheduler")
          echo "HTTP $STATUS"
          jq -c '{downgraded, reminders_sent, reminders_failed, due, charged, failed, skipped, recurring_disabled}' /tmp/resp.json 2>/dev/null || echo "response is not JSON"
          rm -f /tmp/resp.json
          if [ "$STATUS" != "200" ]; then
            exit 1
          fi
