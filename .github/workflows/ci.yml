name: CI
run-name: CI

# pull_request — проверка PR; push только в main — для деплоя (deploy-timeweb.yml
# ждёт успешный CI на main). push в ветки задач не запускает CI второй раз поверх PR.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Шаг 1: TypeScript + ESLint + unit + сборка ──────────────────
  check:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # npm ci: lockfile (npm ≥ 10) содержит бинарники всех платформ, версии ровно как локально.
      - run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Git hook behavior
        run: npm run test:harness

      # Мёртвый код: неиспользуемые файлы, экспорты, зависимости (конфиг — knip.json).
      # knip читает playwright.config.ts, а тот в CI без E2E-кредов падает — заглушки
      # нужны только чтобы загрузить конфиг, тесты здесь не запускаются.
      - name: Knip
        run: npm run knip
        env:
          E2E_TEST_EMAIL: ci-placeholder
          E2E_TEST_PASSWORD: ci-placeholder

      # Сборка без пререндера (SKIP_PRERENDER=1: пререндер требует Chromium и идёт
      # в деплое со строгим PRERENDER_STRICT=1). Ловит ошибки Rollup/vite build до мержа,
      # а не на проде. Переменные Supabase нужны только для инициализации клиента.
      - name: Build (без пререндера)
        run: npm run build
        env:
          SKIP_PRERENDER: '1'
          VITE_SUPABASE_URL: https://avtorstudio.com/sb
          VITE_SUPABASE_ANON_KEY: ci-placeholder

  # ── Шаг 2: Playwright golden-path ───────────────────────────────
  # Требует secrets: VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY,
  #                  E2E_TEST_EMAIL, E2E_TEST_PASSWORD
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: check
    # Все прогоны ходят в прод под одним аккаунтом и одной книгой (cleanup.ts удаляет созданное
    # по времени) — параллельные прогоны стирают данные друг друга. Ставим в очередь, не отменяем.
    concurrency:
      group: e2e-prod-account
      cancel-in-progress: false
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload test artifacts (только при падении)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
