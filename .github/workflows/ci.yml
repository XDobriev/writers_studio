name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  # ── Шаг 1: TypeScript + ESLint ──────────────────────────────────
  # Запускается на любой ветке. Быстро (~30 сек).
  check:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # npm install вместо npm ci — lockfile собирается на Windows,
      # поэтому не содержит Linux optional deps (esbuild, @emnapi).
      - run: npm install --prefer-dedupe

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npm run test

  # ── Шаг 2: Playwright golden-path ───────────────────────────────
  # Запускается только на main или при PR в main.
  # Требует secrets: VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY,
  #                  E2E_TEST_EMAIL, E2E_TEST_PASSWORD
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: check
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm install --prefer-dedupe
      # Rollup-lockfile генерируется на Windows — Linux-бинарник не включён.
      # Без него Vite не стартует. Доставляем явно.
      - run: npm install @rollup/rollup-linux-x64-gnu --no-save

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload test artifacts (только при падении)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
