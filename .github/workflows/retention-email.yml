name: Retention Email

# Основной запуск — pg_cron в Supabase (миграция 20261022000900_cron_billing_retention.sql).
# Этот workflow — ручной резерв. В лог — только статус и счётчики.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retention-email
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call retention-email
        run: |
          STATUS=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://joaxeoavjvlqmtlepkrr.supabase.co/functions/v1/retention-email")
          echo "HTTP $STATUS"
          jq -c '{sent, failed_count}' /tmp/resp.json 2>/dev/null || echo "response is not JSON"
          rm -f /tmp/resp.json
          if [ "$STATUS" != "200" ]; then
            exit 1
          fi
