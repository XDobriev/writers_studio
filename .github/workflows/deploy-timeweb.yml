name: Deploy to Timeweb VPS

on:
  push:
    branches: [main]
  workflow_dispatch:  # также можно запустить вручную из GitHub UI

jobs:
  check:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install --prefer-dedupe
      - run: npm run typecheck
      - run: npm run lint

  deploy:
    needs: check
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://avtorstudio.com/sb
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ADMIN_EMAIL: admin@avtorstudio.com
          VITE_TELEGRAM_BOT_USERNAME: authorsStudioBot

      - name: Validate nginx.conf (security check)
        run: |
          # Проверяем, что proxy_pass ведёт только на ожидаемый Supabase-хост.
          # nginx использует переменную $sb_host — разрешаем её, но проверяем,
          # что сама переменная задана правильным значением.
          UNEXPECTED=$(grep -P 'proxy_pass\s+https?://' deploy/nginx.conf \
            | grep -v 'joaxeoavjvlqmtlepkrr\.supabase\.co' \
            | grep -v '\$sb_host' || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "ERROR: nginx.conf содержит неожиданный proxy_pass:"
            echo "$UNEXPECTED"
            exit 1
          fi
          # Убеждаемся, что $sb_host задан именно нашим Supabase-проектом.
          if ! grep -q 'set \$sb_host joaxeoavjvlqmtlepkrr\.supabase\.co' deploy/nginx.conf; then
            echo "ERROR: \$sb_host не соответствует ожидаемому Supabase-хосту"
            exit 1
          fi
          # Проверяем наличие обязательных security-заголовков.
          for HEADER in "Strict-Transport-Security" "X-Frame-Options" "X-Content-Type-Options"; do
            if ! grep -q "$HEADER" deploy/nginx.conf; then
              echo "ERROR: nginx.conf не содержит заголовок $HEADER"
              exit 1
            fi
          done
          echo "nginx.conf: проверка безопасности пройдена"

      - name: Deploy via rsync
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>&1
          rsync -avz --delete -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes" dist/ "$VPS_USER@$VPS_HOST:/var/www/avtorstudio/dist/"
          rsync -avz -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes" deploy/nginx.conf "$VPS_USER@$VPS_HOST:/var/www/avtorstudio/nginx.conf"

      - name: Reload nginx
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "sudo cp /var/www/avtorstudio/nginx.conf /etc/nginx/sites-available/avtorstudio.com && sudo nginx -t && sudo systemctl reload nginx"
