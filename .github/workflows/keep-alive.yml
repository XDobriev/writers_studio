name: Keep Supabase alive

on:
  schedule:
    - cron: '0 6 */2 * *'   # каждые 2 дня в 06:00 UTC
  workflow_dispatch:          # ручной запуск для проверки

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/app_settings?select=key&limit=1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}")
          echo "Supabase responded with HTTP $STATUS"
          [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]
