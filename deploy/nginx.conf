# nginx config for avtorstudio.com — Vite SPA on Timeweb VPS
# Place at: /etc/nginx/sites-available/avtorstudio.com
# Enable: ln -s /etc/nginx/sites-available/avtorstudio.com /etc/nginx/sites-enabled/
# SSL cert: certbot --nginx -d avtorstudio.com -d www.avtorstudio.com
#
# Файл подключается в http {} (sites-enabled/*), поэтому map и limit_req_zone здесь —
# уровня http. Деплой кладёт ТОЛЬКО этот файл (deploy-nginx-conf.sh), поэтому общие
# заголовки не вынесены в include-сниппет, а собраны через map-переменные ниже.
#
# server_tokens off оставлен в server-блоке, а не на уровне http: если в
# /etc/nginx/nginx.conf он тоже включён, повтор в том же http-контексте — ошибка
# «directive is duplicate», и nginx -t не пройдёт. Для api.avtorstudio.com и прочих
# сайтов сервера server_tokens off нужно раскомментировать в /etc/nginx/nginx.conf.

# Rate limiting: auth — 5 req/s (brute-force protection)
limit_req_zone $binary_remote_addr zone=sb_auth:10m rate=5r/s;

# WebSocket upgrade map — нужен для Supabase Realtime proxy
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- Cache-Control по исходному URL ---
# $request_uri, а не $uri: после try_files → /index.html $uri уже /index.html.
# immutable — только хэшированным ассетам Vite в /assets/. Нехэшированные файлы из
# public/ (favicon, og.png, иконки, звуки) — сутки, чтобы их можно было обновить.
# Ответы прокси /sb/ — пустое значение: add_header с пустым значением не отправляется,
# Cache-Control Supabase не дублируется.
map $request_uri $as_cache_control {
    ~^/sb/                                                              "";
    ~^/assets/                                                          "public, max-age=31536000, immutable";
    ~*^[^?]*\.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|webp|ico|mp3|ogg)(?:\?|$)  "public, max-age=86400";
    default                                                             "no-cache";
}

# --- noindex для приватных и служебных маршрутов ---
# /share/ — расшаренная рукопись не должна попасть в выдачу, даже если ссылка утекла.
map $request_uri $as_robots_tag {
    ~^/(?:books|login|reset-password|admin|share|dictionary|payment-success)(?:[/?]|$)  "noindex, nofollow";
    default                                                                              "";
}

# --- CSP (Report-Only) ---
# Только сообщает о нарушениях (DevTools + report-uri → Sentry, security endpoint
# проекта, environment=vps). Ничего не блокирует. Переключать на
# Content-Security-Policy — после недели отчётов без ложных срабатываний.
# Источники:
#   script: telegram.org (виджет входа), unpkg.com (VK ID SDK), mc.yandex.ru + yastatic.net (Метрика)
#   img:    t.me / telegram.org (аватар Telegram), *.userapi.com (аватар VK),
#           *.supabase.co / api.avtorstudio.com (Storage: обложки, портреты, фоны карт;
#           старые ссылки), mc.yandex.* (пиксель Метрики)
#   connect: /sb/ ('self' + wss://avtorstudio.com), *.supabase.co, api.avtorstudio.com,
#           id.vk.* / api.vk.* / login.vk.* (VK ID), speller.yandex.net (орфография),
#           *.sentry.io (ошибки), mc.yandex.* / mc.webvisor.* (Метрика, Вебвизор)
#   frame:  oauth.telegram.org, id.vk.* / login.vk.* (окна авторизации), mc.yandex.* (Вебвизор)
# 'unsafe-inline' в script-src обязателен: index.html содержит инлайн-скрипты (anti-flash, ld+json).
map $host $as_csp_report_only {
    default "default-src 'self'; script-src 'self' 'unsafe-inline' https://telegram.org https://unpkg.com https://mc.yandex.ru https://yastatic.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://t.me https://telegram.org https://*.userapi.com https://*.supabase.co https://api.avtorstudio.com https://mc.yandex.ru https://mc.yandex.com; font-src 'self' data:; connect-src 'self' wss://avtorstudio.com https://api.avtorstudio.com wss://api.avtorstudio.com https://*.supabase.co wss://*.supabase.co https://id.vk.com https://id.vk.ru https://api.vk.com https://api.vk.ru https://login.vk.com https://login.vk.ru https://speller.yandex.net https://*.sentry.io https://mc.yandex.ru https://mc.yandex.com wss://mc.yandex.ru wss://mc.yandex.com https://mc.webvisor.com https://mc.webvisor.org; frame-src https://oauth.telegram.org https://id.vk.com https://id.vk.ru https://login.vk.com https://login.vk.ru https://mc.yandex.ru https://mc.yandex.com blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; report-uri https://o4511484385427456.ingest.de.sentry.io/api/4511484386607184/security/?sentry_key=b90eee2a89433699457f48e370694a00&sentry_environment=vps";
}

server {
    listen 80;
    server_name avtorstudio.com www.avtorstudio.com;
    server_tokens off;
    return 301 https://avtorstudio.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.avtorstudio.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/avtorstudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avtorstudio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    return 301 https://avtorstudio.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name avtorstudio.com;

    ssl_certificate /etc/letsencrypt/live/avtorstudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avtorstudio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # ssl_stapling убран: Let's Encrypt отключил OCSP в 2025, директива только
    # писала предупреждения в error.log. resolver нужен для прокси /sb/.
    resolver 8.8.8.8 valid=300s ipv6=off;

    server_tokens off;

    # --- Заголовки ---
    # Все add_header — только здесь, на уровне server. Ни одна location ниже не
    # объявляет своих add_header, поэтому эти наследуются везде (в nginx add_header
    # в location отменяет наследование всех заголовков уровня server).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy-Report-Only $as_csp_report_only always;
    add_header X-Robots-Tag $as_robots_tag always;
    add_header Cache-Control $as_cache_control;

    root /var/www/avtorstudio/dist;
    index index.html;

    # --- Gzip ---
    # text/html сжимается всегда. woff2 уже сжат — не включаем.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/css
        text/javascript
        text/plain
        text/xml
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml;

    # --- Source maps не отдаются (загружаются в Sentry при сборке) ---
    location ~ \.map$ {
        return 404;
    }

    # --- Хэшированные ассеты Vite: immutable (см. $as_cache_control) ---
    # Отсутствующий чанк — честный 404, а не index.html.
    # ^~ отключает regex-локации, поэтому .map внутри /assets/ закрыт вложенной локацией.
    location ^~ /assets/ {
        location ~ \.map$ {
            return 404;
        }
        try_files $uri =404;
        access_log off;
    }

    # --- SPA fallback — все маршруты → index.html ---
    # noindex для приватных маршрутов и Cache-Control: no-cache — через map выше.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Supabase proxy — запросы идут через VPS, а не напрямую в EU.
    # VPS build использует VITE_SUPABASE_URL=https://avtorstudio.com/sb
    # ^~ обязателен: без него regex-локации (\.map$) могли бы перехватить storage-запросы.
    # 5 МБ — предел для загрузки обложек/аватарок через Storage (совпадает с лимитом бакетов).
    client_max_body_size 5m;

    # Rate-limited auth proxy (brute-force protection)
    location ^~ /sb/auth/ {
        limit_req zone=sb_auth burst=10 nodelay;
        resolver 8.8.8.8 valid=300s ipv6=off;
        set $sb_host joaxeoavjvlqmtlepkrr.supabase.co;
        rewrite ^/sb/(.*) /$1 break;
        proxy_pass https://$sb_host;
        proxy_ssl_server_name on;
        proxy_ssl_name $sb_host;
        proxy_set_header Host $sb_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }

    location ^~ /sb/ {
        # resolver нужен чтобы nginx резолвил хост при запросе, а не при старте
        resolver 8.8.8.8 valid=300s ipv6=off;
        set $sb_host joaxeoavjvlqmtlepkrr.supabase.co;
        rewrite ^/sb/(.*) /$1 break;
        proxy_pass https://$sb_host;
        proxy_ssl_server_name on;
        proxy_ssl_name $sb_host;
        proxy_set_header Host $sb_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # WebSocket для Supabase Realtime
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }
}
