# nginx config for avtorstudio.com — Vite SPA on Timeweb VPS
# Place at: /etc/nginx/sites-available/avtorstudio.com
# Enable: ln -s /etc/nginx/sites-available/avtorstudio.com /etc/nginx/sites-enabled/
# SSL cert: certbot --nginx -d avtorstudio.com -d www.avtorstudio.com

server {
    listen 80;
    server_name avtorstudio.com www.avtorstudio.com;
    return 301 https://avtorstudio.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.avtorstudio.com;
    ssl_certificate /etc/letsencrypt/live/avtorstudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avtorstudio.com/privkey.pem;
    return 301 https://avtorstudio.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name avtorstudio.com;

    ssl_certificate /etc/letsencrypt/live/avtorstudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avtorstudio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root /var/www/avtorstudio/dist;
    index index.html;

    # --- Gzip ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        font/woff2;

    # --- Кеш для хешированных ассетов Vite (index-[hash].js, ...) ---
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- SPA fallback — все маршруты → index.html ---
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";  # index.html не кешировать
    }

