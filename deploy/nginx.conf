# nginx config for avtorstudio.com — Vite SPA on Timeweb VPS
# Place at: /etc/nginx/sites-available/avtorstudio.com
# Enable: ln -s /etc/nginx/sites-available/avtorstudio.com /etc/nginx/sites-enabled/
# SSL cert: certbot --nginx -d avtorstudio.com -d www.avtorstudio.com

# Rate limiting: auth — 5 req/s (brute-force protection)
limit_req_zone $binary_remote_addr zone=sb_auth:10m rate=5r/s;

# WebSocket upgrade map — нужен для Supabase Realtime proxy
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name avtorstudio.com www.avtorstudio.com;
    return 301 https://avtorstudio.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.avtorstudio.com;

    ssl_certificate /etc/letsencrypt/live/avtorstudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avtorstudio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    return 301 https://avtorstudio.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name avtorstudio.com;

    ssl_certificate /etc/letsencrypt/live/avtorstudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avtorstudio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/avtorstudio.com/chain.pem;
    resolver 8.8.8.8 valid=300s ipv6=off;

    server_tokens off;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /var/www/avtorstudio/dist;
    index index.html;

    # --- Gzip ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        font/woff2;

    # --- Кеш для хешированных ассетов Vite (index-[hash].js, ...) ---
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        access_log off;
    }

    # --- Защищённые маршруты — noindex для ботов ---
    # add_header не наследуется в дочерних location, поэтому security headers дублируются.
    location ~ ^/(books|login|reset-password|admin|share)(/|$) {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # --- SPA fallback — все маршруты → index.html ---
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Supabase proxy — запросы идут через VPS, а не напрямую в EU.
    # VPS build использует VITE_SUPABASE_URL=https://avtorstudio.com/sb
    # ^~ обязателен: без него ~* \.(jpg|png|...) перехватывает storage-запросы раньше этого блока.
    # 5 МБ — предел для загрузки обложек/аватарок через Storage (совпадает с лимитом бакетов).
    client_max_body_size 5m;

    # Rate-limited auth proxy (brute-force protection)
    location ^~ /sb/auth/ {
        limit_req zone=sb_auth burst=10 nodelay;
        resolver 8.8.8.8 valid=300s ipv6=off;
        set $sb_host joaxeoavjvlqmtlepkrr.supabase.co;
        rewrite ^/sb/(.*) /$1 break;
        proxy_pass https://$sb_host;
        proxy_ssl_server_name on;
        proxy_ssl_name $sb_host;
        proxy_set_header Host $sb_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }

    location ^~ /sb/ {
        # resolver нужен чтобы nginx резолвил хост при запросе, а не при старте
        resolver 8.8.8.8 valid=300s ipv6=off;
        set $sb_host joaxeoavjvlqmtlepkrr.supabase.co;
        rewrite ^/sb/(.*) /$1 break;
        proxy_pass https://$sb_host;
        proxy_ssl_server_name on;
        proxy_ssl_name $sb_host;
        proxy_set_header Host $sb_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # WebSocket для Supabase Realtime
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }
}
